# ガチャカタログ自動更新
#
# 毎週月曜 12:00 JST に実行し、各サイトからガチャ情報を取得して
# docs/gacha-catalog.json を更新する。GitHub Pages で自動配信される。
#
# ⚠ GitHub は 60 日間コミットがないリポジトリの scheduled workflow を
#   自動停止する。本ワークフローは lastChecked タイムスタンプを毎回更新し
#   コミットすることで停止を防いでいる。万一停止した場合は
#   Actions タブ → 本ワークフロー → Enable workflow で再有効化できる。

name: Update Gacha Catalog

on:
  schedule:
    - cron: '0 3 * * 1'  # 毎週月曜 03:00 UTC (日本時間 12:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Run scraper
        run: python scripts/scrape_catalog.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gacha-catalog.json
          git diff --cached --quiet || git commit -m "chore: ガチャカタログ自動更新 $(date -u +%Y-%m-%d)"
          git push
